name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests & App
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: OpenCASCADE
        run: brew install opencascade

      - name: Tests
        run: swift test

      - name: Translations complete
        run: scripts/update-strings.sh --check

      - name: App (self-contained)
        run: scripts/build-app.sh release

      - name: Drawing demo
        # Renders the demo cabinet's drawing sheets as PNG/PDF/DXF – handy for reviewing pull requests.
        continue-on-error: true
        timeout-minutes: 5
        run: SIXAXIS_DEMO=1 SIXAXIS_DRAWING_DEMO="$RUNNER_TEMP/drawing" build/6axis.app/Contents/MacOS/SixAxis

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawing-demo
          path: ${{ runner.temp }}/drawing
          if-no-files-found: ignore
          retention-days: 14
