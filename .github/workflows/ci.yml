name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests & App
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: OpenCASCADE
        run: brew install opencascade

      - name: Tests
        run: swift test

      - name: Translations complete
        run: scripts/update-strings.sh --check

      - name: App (self-contained)
        run: scripts/build-app.sh release

      - name: UI check
        # Scripted demos in real windows (German and English): modelling, drawing, examples,
        # background rebuild. Fails on model errors, crashes, hangs or missing screenshots.
        timeout-minutes: 15
        run: scripts/ui-check.sh "$RUNNER_TEMP/ui-check"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check
          path: ${{ runner.temp }}/ui-check
          if-no-files-found: ignore
          retention-days: 14
